<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wall of Colognes ✦ My Collection</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--gold:#d4af37;--gl:#f0d060;--gd:rgba(212,175,55,.3);--glass:rgba(255,255,255,.04);--gb:rgba(212,175,55,.22);--fg:#f0ebe0;--mu:#7a7260;--bg:#07070d}
body{background:var(--bg);background-image:radial-gradient(ellipse at 15% 60%,rgba(212,175,55,.04) 0%,transparent 55%),radial-gradient(ellipse at 85% 15%,rgba(80,50,130,.06) 0%,transparent 55%);color:var(--fg);font-family:'Inter',sans-serif;min-height:100vh;padding:0 1rem 5rem}

/* ── HEADER ── */
header{text-align:center;padding:3.5rem 0 1.5rem}
.ey{font-size:.7rem;letter-spacing:.45em;text-transform:uppercase;color:var(--gold);margin-bottom:.8rem;font-weight:300}
h1{font-family:'Playfair Display',serif;font-size:clamp(2rem,5vw,3.5rem);font-weight:700;background:linear-gradient(135deg,#b8952a 0%,#f0d060 45%,#c9a84c 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.rule{width:80px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:1rem auto}
.sub{font-size:.8rem;color:var(--mu);font-weight:300;letter-spacing:.08em}

/* ── STATS ── */
.stats{display:flex;justify-content:center;max-width:560px;margin:2rem auto 0;background:var(--glass);border:1px solid var(--gb);border-radius:60px;backdrop-filter:blur(12px);overflow:hidden;flex-wrap:wrap}
.stat{flex:1;min-width:110px;text-align:center;padding:.9rem .5rem;position:relative}
.stat+.stat::before{content:'';position:absolute;left:0;top:20%;bottom:20%;width:1px;background:var(--gb)}
.sv{font-family:'Playfair Display',serif;font-size:1.35rem;color:var(--gl)}
.sv.g{color:#4ade80}
.sl{font-size:.58rem;letter-spacing:.18em;text-transform:uppercase;color:var(--mu);margin-top:.1rem}

/* ── FILTER BAR ── */
.fbar{position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:.65rem;flex-wrap:wrap;max-width:1200px;margin:1.5rem auto;padding:.7rem 1.2rem;background:rgba(7,7,13,.9);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--gb);border-radius:50px}
.flbl{font-size:.57rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);white-space:nowrap}
.fpills{display:flex;gap:.3rem;flex-wrap:wrap}
.fp{font-size:.6rem;letter-spacing:.07em;padding:.26rem .7rem;border-radius:20px;border:1px solid rgba(212,175,55,.22);background:transparent;color:var(--mu);cursor:pointer;transition:all .2s;font-family:inherit;text-transform:uppercase}
.fp:hover{border-color:var(--gold);color:var(--gl)}
.fp.on{background:rgba(212,175,55,.14);border-color:var(--gold);color:var(--gl)}
.fp.warn{border-color:rgba(239,68,68,.25);color:rgba(248,113,113,.6)}
.fp.warn:hover,.fp.warn.on{background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.6);color:#f87171}
.fp.asp{border-color:rgba(168,85,247,.3);color:rgba(192,132,252,.6)}
.fp.asp:hover,.fp.asp.on{background:rgba(168,85,247,.12);border-color:rgba(168,85,247,.6);color:#c084fc}
.fsep{width:1px;height:18px;background:var(--gb);flex-shrink:0}
.fsort{font-size:.6rem;letter-spacing:.05em;padding:.26rem .7rem;border-radius:20px;border:1px solid rgba(212,175,55,.22);background:rgba(7,7,13,.9);color:var(--mu);cursor:pointer;font-family:inherit;outline:none;transition:all .2s}
.fsort:focus{border-color:var(--gold);color:var(--gl)}
.fct{margin-left:auto;font-size:.57rem;color:var(--mu);letter-spacing:.07em;white-space:nowrap}

/* ── GRID ── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:1.25rem;max-width:1200px;margin:0 auto}
.none{grid-column:1/-1;text-align:center;padding:3rem;color:var(--mu);font-size:.85rem}

/* ── CARD BASE ── */
.card{background:var(--glass);border:1px solid var(--gb);border-radius:16px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);overflow:hidden;transition:transform .35s cubic-bezier(.34,1.4,.64,1),box-shadow .35s ease;position:relative}
.card:hover{transform:translateY(-6px);box-shadow:0 28px 65px rgba(0,0,0,.6),0 0 40px var(--glow)}

/* ── BOTTLE HOVER ZOOM ── */
.btl{transition:transform .4s cubic-bezier(.34,1.56,.64,1),filter .4s ease;filter:drop-shadow(0 0 12px var(--bcol))}
.card:hover .btl{transform:scale(1.22) translateY(-5px);filter:drop-shadow(0 0 26px var(--bcol)) drop-shadow(0 0 10px var(--bcol))}
/* image zoom */
.ci img{transition:transform .5s ease;width:100%;height:100%;object-fit:cover;object-position:center top}
.card:hover .ci img{transform:scale(1.07)}

/* ── IMAGE ZONE ── */
.ci{height:160px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.bw{display:flex;align-items:center;justify-content:center;width:100%;height:100%}
.ci::after{content:'';position:absolute;bottom:0;left:0;right:0;height:40px;background:linear-gradient(transparent,var(--bg));opacity:.4;pointer-events:none;z-index:1}

/* ── CORNER BADGE ── */
.cb{position:absolute;top:9px;right:9px;font-size:.58rem;padding:.2rem .55rem;border-radius:20px;font-weight:500;letter-spacing:.05em;z-index:4;white-space:nowrap}
.b-steal{background:rgba(34,197,94,.18);color:#4ade80;border:1px solid rgba(34,197,94,.4)}
.b-regret{background:rgba(239,68,68,.18);color:#f87171;border:1px solid rgba(239,68,68,.4)}
.b-scam{background:rgba(239,68,68,.18);color:#f87171;border:1px solid rgba(239,68,68,.4)}
.b-hookup{background:rgba(168,85,247,.2);color:#c084fc;border:1px solid rgba(168,85,247,.45)}
.b-budget{background:rgba(148,163,184,.12);color:#94a3b8;border:1px solid rgba(148,163,184,.25)}

/* ── 💀 DISASTER CARD ── */
@keyframes flicker{
  0%,75%,80%,85%,90%,100%{opacity:1;border-color:rgba(239,68,68,.3);filter:brightness(1)}
  76%{opacity:.45;border-color:rgba(239,68,68,1);filter:brightness(1.5) saturate(1.5)}
  77%{opacity:.95;border-color:rgba(239,68,68,.3);filter:brightness(.9)}
  78%{opacity:.35;border-color:rgba(239,68,68,1);filter:brightness(1.6)}
  79%{opacity:1;border-color:rgba(239,68,68,.3);filter:brightness(1)}
  81%,83%{opacity:.6;border-color:rgba(239,68,68,.8);filter:brightness(1.3)}
  82%,84%{opacity:1;border-color:rgba(239,68,68,.3);filter:brightness(1)}
  86%,88%{opacity:.75;border-color:rgba(239,68,68,.7);filter:brightness(1.2)}
  87%,89%{opacity:1;filter:brightness(1)}
}
@keyframes rGlow{
  0%,100%{box-shadow:0 0 8px rgba(239,68,68,.2),inset 0 0 20px rgba(239,68,68,.04)}
  50%{box-shadow:0 0 22px rgba(239,68,68,.45),inset 0 0 20px rgba(239,68,68,.09)}
}
.card.disaster{
  animation:flicker 6s infinite,rGlow 3s ease-in-out infinite;
  border-color:rgba(239,68,68,.3)!important;
}
.card.disaster:hover{
  transform:translateY(-4px) rotate(.5deg);
  box-shadow:0 20px 50px rgba(239,68,68,.25),0 0 50px rgba(239,68,68,.3)!important;
}
.card.disaster:hover .btl{
  transform:scale(1.08) rotate(3deg);
  filter:drop-shadow(0 0 18px rgba(239,68,68,.9)) drop-shadow(0 0 6px rgba(239,68,68,.6))!important;
}
/* crack overlay */
.crack{position:absolute;inset:0;z-index:3;pointer-events:none}
@keyframes crackFlash{
  0%,70%,100%{opacity:.55}
  76%{opacity:.95}
  78%{opacity:.3}
  80%{opacity:.85}
}
.crack{animation:crackFlash 6s infinite}

/* ── CARD BODY ── */
.cbo{padding:.9rem 1.1rem 1.1rem}
.cbr{font-size:.6rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin-bottom:.2rem}
.cn{font-family:'Playfair Display',serif;font-size:.95rem;font-weight:600;line-height:1.3;margin-bottom:.45rem}
.pills{display:flex;gap:.35rem;flex-wrap:wrap;margin-bottom:.5rem}
.pill{font-size:.58rem;letter-spacing:.08em;padding:.18rem .55rem;border-radius:20px;border:1px solid var(--gb);color:var(--mu);text-transform:uppercase}
.pill-t{border-color:var(--gd);color:var(--gold)}
/* stars */
.stars{display:flex;gap:2px;margin-bottom:.45rem}
.star{font-size:.8rem}
.star.on{color:var(--gold)}
.star.off{color:rgba(212,175,55,.18)}
.star.half{position:relative;display:inline-block;color:rgba(212,175,55,.18)}
.star.half .hfg{position:absolute;left:0;top:0;width:50%;overflow:hidden;color:var(--gold);display:block}
/* review */
.rev{font-size:.68rem;color:var(--mu);font-style:italic;line-height:1.5;margin-bottom:.5rem;border-left:2px solid var(--gd);padding-left:.55rem}
/* prices */
.prices{display:flex;justify-content:space-between;align-items:center;padding-top:.7rem;border-top:1px solid rgba(255,255,255,.06)}
.pc{text-align:center}
.pl{font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);margin-bottom:.15rem}
.pp{font-family:'Playfair Display',serif;font-size:1.25rem;color:var(--gl)}
.pm{font-size:.85rem;color:var(--mu);text-decoration:line-through}
.sb{font-size:.6rem;font-weight:500;padding:.22rem .55rem;border-radius:20px;letter-spacing:.04em;white-space:nowrap}
.s-gr{background:rgba(34,197,94,.15);color:#4ade80;border:1px solid rgba(34,197,94,.3)}
.s-ok{background:rgba(212,175,55,.15);color:var(--gold);border:1px solid var(--gd)}
.s-ne{background:rgba(148,163,184,.1);color:#94a3b8;border:1px solid rgba(148,163,184,.2)}

/* ── FOOTER ── */
footer{text-align:center;margin-top:4rem;color:var(--mu);font-size:.72rem;letter-spacing:.05em;line-height:2}
.fdiv{width:60px;height:1px;background:linear-gradient(90deg,transparent,var(--gd),transparent);margin:2rem auto}
</style>
</head>
<body>
<header>
  <p class="ey">✦ Shetonde's Collection ✦</p>
  <h1>Wall of Colognes</h1>
  <div class="rule"></div>
  <p class="sub">Every bottle has a story. Every spritz, a memory.</p>
</header>

<div class="stats" id="stats"></div>

<div class="fbar">
  <span class="flbl">Type</span>
  <div class="fpills" id="typePills">
    <button class="fp on"  data-type="all">All</button>
    <button class="fp"     data-type="EDT">EDT</button>
    <button class="fp"     data-type="EDP">EDP</button>
    <button class="fp asp" data-type="Parfum" title="Extrait / Pure Parfum — the good stuff">Parfum ✨</button>
    <button class="fp warn" data-type="Other" title="EDC · Eau Fraiche · Attar — hopefully never">Other 😬</button>
  </div>
  <div class="fsep"></div>
  <span class="flbl">Sort</span>
  <select class="fsort" id="sortSel">
    <option value="default">Default</option>
    <option value="savings">Best Savings %</option>
    <option value="rating">Highest Rated</option>
    <option value="paid_asc">Price ↑</option>
    <option value="paid_desc">Price ↓</option>
    <option value="brand">Brand A–Z</option>
  </select>
  <span class="fct" id="fct"></span>
</div>

<div class="grid" id="grid"></div>
<div class="fdiv"></div>
<footer>
  <p>✦ MSRP values marked ~ are approximate market prices ✦</p>
  <p>Curated by <span style="color:var(--gold);letter-spacing:.08em">Shetonde</span> &nbsp;·&nbsp; 2026</p>
</footer>

<script>
// ╔══════════════════════════════════════════════════════════════════════════╗
// ║  ✏️  YOUR COLOGNE COLLECTION                                            ║
// ║  Edit this section to update the site — nothing else needs to change.  ║
// ╚══════════════════════════════════════════════════════════════════════════╝
//
//  FIELD GUIDE:
//  brand    → Brand name shown above the title
//  name     → Fragrance name
//  type     → "EDT" | "EDP" | "Parfum" | "Extrait" | "EDC" | "Attar" | etc.
//             Filter pills: EDT / EDP / Parfum(✨) / Other(😬 = EDC, Fraiche, Attar)
//  size     → e.g. "3.4 oz" | "10 ml" | "Travel Mini"
//  paid     → Price you paid (number, no $ sign)
//  msrp     → Retail price (number) — "~" prefix added automatically
//  rating   → Your score 1–5  (0 or omit to hide stars)
//  review   → Short personal note (string), or null to hide
//
//  img      → HOW TO ADD A BOTTLE PHOTO:
//               null  → shows the auto bottle illustration (default)
//               "https://..." → shows your photo. If the link breaks,
//               the illustration shows automatically as a fallback.
//               Tip: upload to imgur.com or imgbb.com, paste the direct link.
//
//  badge    → { l: "Label", c: "css-class" } or null
//             classes: b-steal  b-hookup  b-budget  b-scam  b-regret
//  special  → "disaster" adds the cracked/flickering horror effect. Use sparingly.
//  color    → Hex color for bottle glow & tint
//  grad     → Two rgba() values for card bg gradient
//
// ── TO ADD A NEW COLOGNE ─────────────────────────────────────────────────
//  {
//    brand:"Brand", name:"Name", type:"EDP", size:"3.4 oz",
//    paid:0, msrp:0, rating:0, review:null, img:null,
//    badge:null, special:null,
//    color:"#c9a84c", grad:"rgba(201,168,76,.2),rgba(0,0,0,.55)"
//  },
// ─────────────────────────────────────────────────────────────────────────

const DATA = [

  // ── BUDGET FINDS ──────────────────────────────────────────────────────────
  {
    brand:"Racing Club", name:"Red", type:"EDT", size:"3.4 oz",
    paid:5, msrp:18, rating:3,
    review:"Smells decent for $5. Wouldn't wear it out but fine at home.",
    img:"https://i.imgur.com/NtCIhsK.jpeg", badge:{l:"Budget Find",c:"b-budget"}, special:null,
    color:"#c0392b", grad:"rgba(192,57,43,.28),rgba(0,0,0,.55)"
  },
  {
    brand:"Racing Club", name:"Blue", type:"EDT", size:"3.4 oz",

    img:"https://i.imgur.com/6zzbPJO.jpeg", badge:{l:"Budget Find",c:"b-budget"}, special:null,
    color:"#2980b9", grad:"rgba(41,128,185,.28),rgba(0,0,0,.55)"
  },
  {
    brand:"Racing Club", name:"Black", type:"EDT", size:"3.4 oz",
    paid:5, msrp:18, rating:2,
    review:"Tries to be dark and broody. Falls flat after about an hour.",
    img:"https://i.imgur.com/oAtKDMl.jpeg", badge:{l:"Budget Find",c:"b-budget"}, special:null,
    color:"#8e9eab", grad:"rgba(55,60,80,.45),rgba(0,0,0,.6)"
  },
  {
    brand:"Le Grande", name:"White", type:"EDT", size:"3.4 oz",
    paid:5, msrp:18, rating:2.5,
    review:"Clean and fresh. Fine for the price but nothing memorable.",
    img:"https://i.imgur.com/6qBrtev.jpeg", badge:{l:"Budget Find",c:"b-budget"}, special:null,
    color:"#c8d3da", grad:"rgba(190,200,210,.15),rgba(0,0,0,.55)"
  },
  {
    brand:"Family Dollar", name:"Scentfull Gold Dust", type:"Body Mist", size:"3.7 oz",
    paid:3.40, msrp:8, rating:1,
    review:"Not even a cologne. A body mist. From Family Dollar. What was I thinking.",
    img:"https://i.imgur.com/fUxA4Yc.jpeg", badge:{l:"🚫 Avoid",c:"b-regret"}, special:"disaster",
    color:"#ef4444", grad:"rgba(239,68,68,.2),rgba(60,0,0,.7)"
  },
  {
    brand:"Family Dollar", name:"Cherry Rebel", type:"Body Spray", size:"Unknown",
    paid:3.99, msrp:8, rating:1,
    review:"Smelled like a gas station air freshener. The name was the best thing about it.",
    img:"https://i.imgur.com/jsXuAq2.jpeg", badge:{l:"🚫 Avoid",c:"b-regret"}, special:"disaster",
    color:"#ef4444", grad:"rgba(239,68,68,.2),rgba(60,0,0,.7)"
  },

  // ── DESIGNER & NICHE ──────────────────────────────────────────────────────
  {
    brand:"Jimmy Choo", name:"Man Blue", type:"EDT", size:"Standard",
    paid:52, msrp:75, rating:4,
    review:"Great summer fragrance. Light, citrusy, crowd-pleasing. Solid buy.",
    img:"https://i.imgur.com/x60mN12.jpeg", badge:null, special:null,
    color:"#2471a3", grad:"rgba(36,113,163,.28),rgba(0,0,0,.52)"
  },
  {
    brand:"Mahajan", name:"Desperado (Original)", type:"EDP", size:"Standard",
    paid:54, msrp:80, rating:4,
    review:"Unique and bold. Gets compliments. Worth every dollar.",
    img:"https://i.imgur.com/Lf83HzB.jpeg", badge:null, special:null,
    color:"#884ea0", grad:"rgba(136,78,160,.28),rgba(0,0,0,.52)"
  },
  {
    brand:"Generic / Niche", name:"Exotic Amber", type:"EDP", size:"Standard",
    paid:30, msrp:45, rating:3.5,
    review:"Warm amber base, nice longevity. A bit generic but pleasant.",
    img:"https://i.imgur.com/KaaX8pe.png", badge:null, special:null,
    color:"#d35400", grad:"rgba(211,84,0,.28),rgba(0,0,0,.52)"
  },
  {
    brand:"Rue Broca", name:"Exotic Heritage", type:"EDP", size:"Standard",
    paid:25, msrp:35, rating:5,
    review:"My football teammates used to BEG me to wear this after practice. Undeniable. No debate.",
    img:"https://i.imgur.com/yLlW7UF.jpeg", badge:null, special:null,
    color:"#a04000", grad:"rgba(160,64,0,.28),rgba(0,0,0,.52)"
  },
  {
    brand:"Jean Paul Gaultier", name:"Le Male Elixir Absolu", type:"EDP", size:"6.8 oz",
    paid:35, msrp:175, rating:5,
    review:"The crown jewel. Heavy, seductive, beast-mode longevity. $35 for this is criminal.",
    img:"https://i.imgur.com/EtMOD1y.jpeg", badge:{l:"💎 Hookup Deal",c:"b-hookup"}, special:null,
    color:"#c9a84c", grad:"rgba(15,20,60,.7),rgba(201,168,76,.22)"
  },
  {
    brand:"Afnan", name:"9 PM Elixir", type:"EDP", size:"Standard",
    paid:35, msrp:55, rating:4,
    review:"Dark, sweet, smoky. Perfect for nights out. Excellent value.",
    img:"https://i.imgur.com/hUwWxhj.png", badge:null, special:null,

  },
  {
    brand:"Lattafa", name:"Asad Bourbon", type:"EDP", size:"Standard",
    paid:51, msrp:60, rating:3,
    review:"Smells like expensive whiskey on skin. Nice, but not $51 nice. Felt burned.",
    img:"https://i.imgur.com/dbCK9Ps.jpeg", badge:{l:"😤 Felt Scammed",c:"b-scam"}, special:null,
    color:"#784212", grad:"rgba(120,66,18,.38),rgba(0,0,0,.52)"
  },
  {
    brand:"Lattafa", name:"Layali Rouge", type:"EDP", size:"Travel Mini",

    color:"#c0392b", grad:"rgba(192,57,43,.25),rgba(0,0,0,.52)"
  },
  {
    brand:"Creed", name:"Aventus Refill", type:"EDP", size:"10 ml",
    paid:10, msrp:50, rating:4.5,
    review:"Overhyped going in — but at $10 it earned its place. The birch smoke and pineapple are real.",
    img:"https://i.imgur.com/iuT5ghj.jpeg", badge:{l:"🔥 Steal",c:"b-steal"}, special:null,
    color:"#1e8449", grad:"rgba(30,132,73,.28),rgba(0,0,0,.52)"
  },

]; // ← Add new colognes above this line.

// ══════════════════════════════════════════════════════════════
//  RENDERING ENGINE — no need to edit below this line
// ══════════════════════════════════════════════════════════════

// Stats bar
const tP=DATA.reduce((s,c)=>s+c.paid,0), tM=DATA.reduce((s,c)=>s+c.msrp,0);
document.getElementById('stats').innerHTML=`
  <div class="stat"><div class="sv">${DATA.length}</div><div class="sl">Bottles</div></div>
  <div class="stat"><div class="sv">$${tP}</div><div class="sl">Total Paid</div></div>
  <div class="stat"><div class="sv">~$${tM}</div><div class="sl">Total MSRP</div></div>
  <div class="stat"><div class="sv g">$${tM-tP}</div><div class="sl">Total Saved</div></div>`;

function savBadge(paid,msrp){
  const p=Math.round(((msrp-paid)/msrp)*100);
  if(paid>=msrp)return{l:"Full Price",c:"s-ne"};
  if(p>=60)return{l:`${p}% off 🔥`,c:"s-gr"};
  if(p>=25)return{l:`${p}% off`,c:"s-ok"};
  return{l:`${p}% off`,c:"s-ne"};
}
function stars(n){
  if(!n)return'';
  let h='<div class="stars">';
  for(let i=1;i<=5;i++){
    if(n>=i)          h+=`<span class="star on">★</span>`;
    else if(n>=i-.5)  h+=`<span class="star half">★<span class="hfg">★</span></span>`;
    else              h+=`<span class="star off">★</span>`;
  }
  return h+'</div>';
}
function bottleSVG(col){
  return`<svg class="btl" width="68" height="110" viewBox="0 0 68 110" xmlns="http://www.w3.org/2000/svg">
    <rect x="27" y="4" width="14" height="5" rx="2" fill="${col}" opacity=".95"/>
    <rect x="22" y="9" width="24" height="4" rx="1.5" fill="${col}" opacity=".75"/>
    <rect x="28" y="13" width="12" height="8" rx="1" fill="${col}" opacity=".55"/>
    <path d="M14 22 Q14 20 28 19 L40 19 Q54 20 54 22 L56 28 Q34 25 12 28 Z" fill="${col}" opacity=".4"/>
    <rect x="12" y="28" width="44" height="74" rx="7" fill="${col}" opacity=".14"/>
    <rect x="12" y="28" width="44" height="74" rx="7" fill="none" stroke="${col}" stroke-width="1.4" opacity=".7"/>
    <rect x="16" y="34" width="7" height="28" rx="3.5" fill="white" opacity=".07"/>
    <rect x="20" y="46" width="28" height="42" rx="3" fill="${col}" opacity=".08"/>
    <rect x="20" y="46" width="28" height="42" rx="3" fill="none" stroke="${col}" stroke-width=".7" opacity=".35"/>
  </svg>`;
}

// Shattered-glass crack SVG overlay for the disaster card
const CRACK_SVG=`<svg class="crack" viewBox="0 0 220 160" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3">
  <path d="M68,0 L80,36 L58,44 L85,98 L68,104 L92,160" stroke="rgba(255,70,50,.7)" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <path d="M80,36 L106,28 L122,52" stroke="rgba(255,70,50,.45)" stroke-width=".9" fill="none" stroke-linecap="round"/>
  <path d="M85,98 L110,90 L132,112" stroke="rgba(255,70,50,.4)" stroke-width=".8" fill="none" stroke-linecap="round"/>
  <path d="M122,52 L140,48" stroke="rgba(255,70,50,.3)" stroke-width=".7" fill="none" stroke-linecap="round"/>
  <path d="M152,0 L140,32 L158,50 L138,78 L156,160" stroke="rgba(255,70,50,.55)" stroke-width="1.3" fill="none" stroke-linecap="round"/>
  <path d="M140,32 L118,27" stroke="rgba(255,70,50,.35)" stroke-width=".7" fill="none" stroke-linecap="round"/>
  <path d="M158,50 L175,58 L168,80" stroke="rgba(255,70,50,.3)" stroke-width=".7" fill="none" stroke-linecap="round"/>
  <circle cx="80" cy="36" r="2.5" fill="rgba(255,70,50,.35)"/>
  <circle cx="85" cy="98" r="2" fill="rgba(255,70,50,.3)"/>
  <circle cx="140" cy="32" r="2" fill="rgba(255,70,50,.3)"/>
</svg>`;

function makeCard(c){
  const sv=savBadge(c.paid,c.msrp);
  const imgInner=c.img
    ?`<img src="${c.img}" alt="${c.name}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="bw" style="display:none">${bottleSVG(c.color)}</div>`
    :`<div class="bw">${bottleSVG(c.color)}</div>`;

  const el=document.createElement('div');
  el.className='card'+(c.special==='disaster'?' disaster':'');
  el.style.setProperty('--glow',c.color+'28');
  el.style.setProperty('--bcol',c.color+'bb');
  el.innerHTML=`
    <div class="ci" style="background:linear-gradient(135deg,${c.grad})">
      ${imgInner}
      ${c.special==='disaster'?CRACK_SVG:''}
      ${c.badge?`<div class="cb ${c.badge.c}">${c.badge.l}</div>`:''}
    </div>
    <div class="cbo">
      <div class="cbr">${c.brand}</div>
      <div class="cn">${c.name}</div>
      <div class="pills"><span class="pill pill-t">${c.type}</span><span class="pill">${c.size}</span></div>
      ${stars(c.rating||0)}
      ${c.review?`<div class="rev">"${c.review}"</div>`:''}
      <div class="prices">
        <div class="pc"><div class="pl">I Paid</div><div class="pp">$${c.paid}</div></div>
        <div class="pc"><span class="sb ${sv.c}">${sv.l}</span></div>
        <div class="pc"><div class="pl">MSRP</div><div class="pm">~$${c.msrp}</div></div>
      </div>
    </div>`;
  return el;
}

// Filter type normalization
const PARFUM_TYPES=new Set(['parfum','extrait','pure parfum','extrait de parfum']);
function typeGroup(t){
  const l=t.toLowerCase();
  if(l==='edt')return'EDT';
  if(l==='edp')return'EDP';
  if(PARFUM_TYPES.has(l)||l.includes('parfum')&&l!=='edp')return'Parfum';
  return'Other';
}

let aType='all',aSort='default';
function render(){
  let items=[...DATA];
  if(aType!=='all')items=items.filter(c=>typeGroup(c.type)===aType);
  const sorts={
    savings:(a,b)=>((b.msrp-b.paid)/b.msrp)-((a.msrp-a.paid)/a.msrp),
    rating:(a,b)=>(b.rating||0)-(a.rating||0),
    paid_asc:(a,b)=>a.paid-b.paid,
    paid_desc:(a,b)=>b.paid-a.paid,
    brand:(a,b)=>a.brand.localeCompare(b.brand)
  };
  if(sorts[aSort])items.sort(sorts[aSort]);
  document.getElementById('fct').textContent=`${items.length} of ${DATA.length} shown`;
  const grid=document.getElementById('grid');
  grid.innerHTML='';
  if(!items.length){grid.innerHTML='<div class="none">No colognes match this filter.</div>';return;}
  items.forEach(c=>grid.appendChild(makeCard(c)));
}

document.getElementById('typePills').addEventListener('click',e=>{
  const b=e.target.closest('.fp');if(!b)return;
  document.querySelectorAll('.fp').forEach(p=>p.classList.remove('on'));
  b.classList.add('on');
  aType=b.dataset.type;render();
});
document.getElementById('sortSel').addEventListener('change',e=>{aSort=e.target.value;render();});
render();
</script>
